services:
  app:
    build: .
    container_name: looktrendy_app
    volumes:
      - .:/var/www/html
      - /var/www/html/node_modules
      - /var/www/html/public/build 
    ports:
      - "8000:8000"
      - "5173:5173" 
    environment:
      - APP_URL=http://localhost:8000
      - VITE_APP_URL=http://localhost:5173
      - APP_ENV=local
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=looktrendy
      - DB_USERNAME=root
      - DB_PASSWORD=secret
    command: >
      sh -c "
      npm install &&
      npm run build &&
      php artisan serve --host=0.0.0.0 --port=8000
      "
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - looktrendy_network

  mysql:
    image: mysql:8.0.30
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 10
    container_name: looktrendy_mysqlclea
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: looktrendy
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"  
    networks:
      - looktrendy_network

networks:
  looktrendy_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local